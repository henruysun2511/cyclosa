spring.application.name=cyclosa_be

server.port=${PORT:8080}

spring.profiles.active=local

# Database Configuration (Local PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cyclosa_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.open-in-view=false

# Redis Configuration (Optional / Local Cache)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# JWT Security
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.access-token-expiry=86400000
app.jwt.refresh-token-expiry=604800000

# Frontend URLs & CORS
app.oauth2.frontend-redirect-uri=${FRONTEND_REDIRECT_URI:http://localhost:3000/oauth2/callback}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:3000/reset-password}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

app.rate-limit.requests-per-minute=60

# Cloudinary Storage Configuration
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dcaqsxy0q}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:683151351725371}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:p1_vQGal7zAPKPyBtJflLAGss-g}

# Cyclosa AI Microservice
cyclosa.ai.url=${CYCLOSA_AI_URL:http://localhost:8000}
cyclosa.ai.internal-key=${CYCLOSA_AI_INTERNAL_KEY:cyclosa-internal-ai-secret-key-2026}
cyclosa.ai.base-url=${CYCLOSA_AI_BASE_URL:http://localhost:8000}
cyclosa.ai.api-key=${CYCLOSA_AI_API_KEY:cyclosa-ai-secret-key-2026}

# Logging
logging.level.com.cyclosa=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
