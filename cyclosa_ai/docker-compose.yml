version: '3.8'

services:
  cyclosa-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyclosa_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - ENVIRONMENT=development
      - INTERNAL_API_KEY=cyclosa-internal-ai-secret-key-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gemini/gemini-1.5-flash}
      - REDIS_URL=${REDIS_URL:-redis://default:VCqWKgrA6YT0AvTlpyS7CuHLbwFkrbdm@price-uppermost-cap-25659.db.redis.io:13654}
    volumes:
      - .:/app
    networks:
      - cyclosa-network

networks:
  cyclosa-network:
    name: cyclosa_network
    external: true
